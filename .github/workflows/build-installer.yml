name: Build Nexo 3D Exchange

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install pyinstaller

      - name: Run tests
        shell: pwsh
        run: python -m pytest

      - name: Build N3X executable
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --name n3x src/n3x/__main__.py

      - name: Verify executable
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/n3x.exe")) {
            throw "n3x.exe was not created."
          }
          ./dist/n3x.exe --help

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist" | Out-Null
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "installer\N3X.iss"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Nexo-3D-Exchange-Windows-Installer
          path: dist/Nexo-3D-Exchange-Setup-*.exe
          if-no-files-found: error

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: Nexo-3D-Exchange-Windows-Executable
          path: dist/n3x.exe
          if-no-files-found: error
